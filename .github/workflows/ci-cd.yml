
name: Test and deploy to EC2

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/[Rr][Ee][Aa][Dd][Mm][Ee]*'

permissions:
  contents: read

jobs:
  notify_commit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discord에 커밋 push 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMIT_WEBHOOK_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo '::error::DISCORD_COMMIT_WEBHOOK_URL Secret을 등록해야 합니다.'
            exit 1
          fi
          if [[ "$DISCORD_WEBHOOK_URL" == */github || "$DISCORD_WEBHOOK_URL" == */github/ ]]; then
            echo '::error::DISCORD_WEBHOOK_URL에는 /github를 붙이지 않은 Discord 원본 웹훅 URL을 등록해야 합니다.'
            exit 1
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n \
            --arg url "$run_url" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg actor "$GITHUB_ACTOR" \
            --arg commit "${GITHUB_SHA:0:7}" \
            --arg commit_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --arg message "$(jq -r '.head_commit.message // "커밋 메시지 없음"' "$GITHUB_EVENT_PATH")" \
            '{allowed_mentions: {parse: []}, embeds: [{title: "📦 커밋 push", color: 3447003, url: $url, description: ($message | .[0:4096]), fields: [
              {name: "저장소", value: $repository},
              {name: "브랜치", value: $branch, inline: true},
              {name: "작성자", value: $actor, inline: true},
              {name: "커밋", value: ("[" + $commit + "](" + $commit_url + ")"), inline: true},
              {name: "실행 로그", value: $url}
            ]}]}')
          separator='?'
          [[ "$DISCORD_WEBHOOK_URL" != *\?* ]] || separator='&'
          curl --fail-with-body --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$payload" "${DISCORD_WEBHOOK_URL}${separator}wait=true"
          echo 'Discord 커밋 알림 전송 완료'

  test:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4
      - name: pnpm 설정
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 의존성 설치
        run: pnpm install --frozen-lockfile
      - name: 테스트 실행
        run: pnpm test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
    steps:
      - name: SSH 설정
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${EC2_HOST:?Set EC2_HOST}"
          : "${EC2_USER:?Set EC2_USER}"
          : "${EC2_DEPLOY_PATH:?Set EC2_DEPLOY_PATH}"
          : "${EC2_SSH_KEY:?Set EC2_SSH_KEY}"
          [[ "$EC2_DEPLOY_PATH" == /* && "$EC2_DEPLOY_PATH" != / ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H "$EC2_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
      - name: EC2에서 코드 업데이트, 빌드 및 재시작
        run: |
          set -euo pipefail
          printf -v remote_path '%q' "$EC2_DEPLOY_PATH"
          ssh -o BatchMode=yes "$EC2_USER@$EC2_HOST" "bash -l -s -- $remote_path" <<'REMOTE'
          set -euo pipefail
          cd -- "$1"
          sudo -n git rev-parse --is-inside-work-tree
          [[ "$(sudo -n git branch --show-current)" == master ]]
          # 이전 서버에서 변경된 version.json이 업데이트를 막지 않도록 백업한다.
          if sudo -n git cat-file -e HEAD:version.json 2>/dev/null; then
            if ! sudo -n git diff --quiet HEAD -- version.json; then
              version_backup_dir=$(sudo -n mktemp -d /tmp/react-mbti-version.XXXXXX)
              sudo -n git diff --binary HEAD -- version.json \
                | sudo -n tee "$version_backup_dir/version.patch" > /dev/null
              echo "version.json 변경 백업: $version_backup_dir/version.patch"
              sudo -n git restore --source=HEAD --staged --worktree -- version.json
            fi
          fi
          sudo -n env GIT_TERMINAL_PROMPT=0 git pull --ff-only origin master
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm --version
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm install --frozen-lockfile
          sudo -n env "PATH=$PATH" COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm build
          COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm reload --env production --update-env
          REMOTE

  notify_success:
    needs: [test, deploy]
    if: ${{ always() && github.event_name == 'push' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discord에 배포 성공 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_SUCCESS_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          webhook_secret='DISCORD_SUCCESS_WEBHOOK_URL'
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::GitHub 저장소 Settings → Secrets and variables → Actions에 $webhook_secret Secret을 등록해야 합니다."
            exit 1
          fi
          if [[ "$DISCORD_WEBHOOK_URL" == */github || "$DISCORD_WEBHOOK_URL" == */github/ ]]; then
            echo '::error::DISCORD_WEBHOOK_URL에는 /github를 붙이지 않은 Discord 원본 웹훅 URL을 등록해야 합니다.'
            exit 1
          fi

          title='✅ 배포 성공'
          color=3066993
          description='EC2 코드 업데이트, 빌드 및 재시작을 완료했습니다.'

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n \
            --arg title "$title" \
            --arg description "$description" \
            --argjson color "$color" \
            --arg url "$run_url" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg test "$TEST_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            '{allowed_mentions: {parse: []}, embeds: [{title: $title, description: $description, color: $color, url: $url, fields: [
              {name: "실행 로그", value: $url},
              {name: "저장소", value: $repository},
              {name: "브랜치", value: $branch, inline: true},
              {name: "테스트", value: $test, inline: true},
              {name: "배포", value: $deploy, inline: true}
            ]}]}')
          separator='?'
          [[ "$DISCORD_WEBHOOK_URL" != *\?* ]] || separator='&'
          curl --fail-with-body --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$payload" "${DISCORD_WEBHOOK_URL}${separator}wait=true"
          echo 'Discord 배포 성공 알림 전송 완료'

  notify_failure:
    needs: [test, deploy]
    if: ${{ always() && github.event_name == 'push' && (needs.deploy.result == 'failure' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Discord에 배포 실패 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_FAILURE_WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          webhook_secret='DISCORD_FAILURE_WEBHOOK_URL'
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::GitHub 저장소 Settings → Secrets and variables → Actions에 $webhook_secret Secret을 등록해야 합니다."
            exit 1
          fi
          if [[ "$DISCORD_WEBHOOK_URL" == */github || "$DISCORD_WEBHOOK_URL" == */github/ ]]; then
            echo '::error::DISCORD_WEBHOOK_URL에는 /github를 붙이지 않은 Discord 원본 웹훅 URL을 등록해야 합니다.'
            exit 1
          fi

          color=15158332
          if [[ "$TEST_RESULT" == 'failure' ]]; then
            title='❌ 배포 실패 (테스트 실패)'
            description='테스트 실패로 EC2 배포가 중단되었습니다. 실행 로그를 확인하세요.'
          else
            title='❌ 배포 실패'
            description='EC2 배포 중 오류가 발생했습니다. 실행 로그를 확인하세요.'
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          payload=$(jq -n \
            --arg title "$title" \
            --arg description "$description" \
            --argjson color "$color" \
            --arg url "$run_url" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$REF_NAME" \
            --arg test "$TEST_RESULT" \
            --arg deploy "$DEPLOY_RESULT" \
            '{allowed_mentions: {parse: []}, embeds: [{title: $title, description: $description, color: $color, url: $url, fields: [
              {name: "실행 로그", value: $url},
              {name: "저장소", value: $repository},
              {name: "브랜치", value: $branch, inline: true},
              {name: "테스트", value: $test, inline: true},
              {name: "배포", value: $deploy, inline: true}
            ]}]}')
          separator='?'
          [[ "$DISCORD_WEBHOOK_URL" != *\?* ]] || separator='&'
          curl --fail-with-body --silent --show-error --output /dev/null \
            --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/json' \
            --data "$payload" "${DISCORD_WEBHOOK_URL}${separator}wait=true"
          echo 'Discord 배포 실패 알림 전송 완료'
