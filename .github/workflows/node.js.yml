name: CI/CD Deploy

permissions:
  contents: write

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "**/README.md"
      - "**/README.*"
  pull_request:
    branches: ["master"]
    paths-ignore:
      - "**/README.md"
      - "**/README.*"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare app directory
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p '${{ secrets.EC2_APP_DIR }}'"

      - name: Sync project to EC2
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key.pem" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude ".env" \
            --exclude ".env.*" \
            ./ "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_APP_DIR }}/"

      - name: Install, build, and reload on EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e
            cd "${{ secrets.EC2_APP_DIR }}"
            mkdir -p "$HOME/.local/bin"
            export PATH="$HOME/.local/bin:$PATH"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@10 --activate
            pnpm install --frozen-lockfile
            pnpm build
            pnpm reload || pnpm start
          EOF

      - name: Bump dist version
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "version.json";
          const version = JSON.parse(fs.readFileSync(file, "utf8"));
          const key = Object.prototype.hasOwnProperty.call(version, "DIST_VER") ? "DIST_VER" : "dist_ver";
          const parts = String(version[key] ?? "0").split(".");
          const lastIndex = parts.length - 1;
          parts[lastIndex] = String((Number(parts[lastIndex]) || 0) + 1);
          version[key] = parts.join(".");
          fs.writeFileSync(file, JSON.stringify(version, null, 2) + "\n");
          console.log(key + "=" + version[key]);
          NODE

      - name: Commit dist version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump dist version [skip ci]"
          git push origin HEAD:master
